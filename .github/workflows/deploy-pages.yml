name: Deploy Sprechraum to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish only client files. Server code, scripts, iOS sources and docs stay out of the public site.
      - name: Build public site folder
        run: |
          mkdir _site
          cp index.html phone-preview.html manifest.webmanifest sw.js *.css *.js _site/
          cp -r assets data _site/
          rm -rf _site/assets/rigs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
