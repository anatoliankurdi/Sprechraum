      <path id="face_light" d="M350 119c91 0 144 72 139 205-5 134-59 228-139 228s-134-94-139-228c-5-133 48-205 139-205z" fill="url(#studioFaceLight)"/>
      <path id="jaw_shade" d="M244 437q106 125 212 0-22 111-106 115-84-4-106-115z" fill="#7c4036" opacity=".06"/>

      <g id="hair_front">
        <path d="M205 331c-18-141 39-230 144-233 112-3 169 88 147 237-20-62-49-112-113-141-43 49-102 82-175 87z" fill="url(#studioHair)"/>
        <path d="M235 242c34-91 105-126 175-84-72 2-100 55-175 84z" fill="#b17b58" opacity=".45"/>
        <path d="M215 263c-8 92 17 184 73 236-61-21-91-75-91-155 0-49 5-74 18-101zM484 242c19 85 5 188-72 259 74-23 101-94 90-172-5-39-8-63-18-87z" fill="url(#studioHair)"/>
