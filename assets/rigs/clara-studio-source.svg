        <g id="eye_right"><path d="M373 365q35-28 70 0-34 31-70 0z" fill="#fffdfa"/><circle id="iris_right" cx="409" cy="365" r="15" fill="url(#studioIris)"/><circle id="pupil_right" cx="409" cy="367" r="7" fill="#171413"/><circle cx="404" cy="360" r="4" fill="#fff"/><path id="lid_right" d="M373 363q35-29 70 0" fill="none" stroke="#4c3029" stroke-width="5" stroke-linecap="round"/></g>
      </g>

      <g id="cheeks"><ellipse cx="263" cy="424" rx="36" ry="17" fill="#e98784" opacity=".18"/><ellipse cx="438" cy="424" rx="36" ry="17" fill="#e98784" opacity=".18"/></g>
      <path id="nose" d="M349 365q-12 54 8 70 9 3 18-4" fill="none" stroke="#ba7763" stroke-width="7" stroke-linecap="round"/>

