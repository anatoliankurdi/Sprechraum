        <g id="viseme_I" opacity="0"><path d="M-55 3Q0-10 55 3Q0 27-55 3Z" fill="#54232e"/><path d="M-44 4Q0 14 44 4L38 14Q0 19-38 14Z" fill="#fffaf2"/></g>
        <g id="viseme_O" opacity="0"><ellipse cx="0" cy="19" rx="30" ry="39" fill="#54232e"/><ellipse cx="0" cy="35" rx="17" ry="11" fill="#d97982"/></g>
        <g id="viseme_U" opacity="0"><ellipse cx="0" cy="15" rx="22" ry="30" fill="#54232e"/></g>
        <g id="viseme_M" opacity="0"><path d="M-44 4Q0 15 44 4Q0 20-44 4Z" fill="#8f4652"/></g>
