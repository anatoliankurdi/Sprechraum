      <g id="forearm_left"><path d="M190 738c-9 54-3 102 9 144l55-7c0-48 1-87-6-127z" fill="#172956"/></g>
      <g id="hand_left"><path d="M198 858h55v24h-55z" fill="url(#studioSkin)"/><path d="M192 878q29-24 62 0l4 37q-31 31-66 1z" fill="url(#studioSkin)" stroke="#ca8d70" stroke-width="2"/><path d="M201 893q21-10 45 0M201 903q21-8 45 1" fill="none" stroke="#ca8d70" stroke-width="2" stroke-linecap="round"/></g>
    </g>

    <g id="arm_right">
