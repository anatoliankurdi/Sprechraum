<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900">
  <defs>
    <linearGradient id="studioJacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263c74"/><stop offset="1" stop-color="#0d1939"/></linearGradient>
    <linearGradient id="studioSkin" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#f7ceb2"/><stop offset=".58" stop-color="#efb792"/><stop offset="1" stop-color="#d99b79"/></linearGradient>
    <linearGradient id="studioHair" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#9b6747"/><stop offset=".48" stop-color="#65402f"/><stop offset="1" stop-color="#34231f"/></linearGradient>
    <radialGradient id="studioFaceLight" cx="34%" cy="23%" r="73%"><stop stop-color="#fff" stop-opacity=".32"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#784337" stop-opacity=".14"/></radialGradient>
    <radialGradient id="studioIris" cx="37%" cy="31%" r="64%"><stop stop-color="#b69466"/><stop offset=".5" stop-color="#6b4b30"/><stop offset="1" stop-color="#251a16"/></radialGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#09142d" flood-opacity=".2"/></filter>
    <filter id="studioFeature" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#5c2831" flood-opacity=".2"/></filter>
  </defs>

