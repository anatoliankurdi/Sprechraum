      <path id="shirt" d="M285 595l65 131 66-131 54 28-51 277H280l-51-277z" fill="#fff8ef"/>
      <path id="lapel_left" d="M285 595l65 131-47 174H115c8-191 79-270 170-305z" fill="#172956" opacity=".92"/>
      <path id="lapel_right" d="M416 595l-66 131 47 174h188c-7-191-78-270-169-305z" fill="#101f46" opacity=".92"/>
